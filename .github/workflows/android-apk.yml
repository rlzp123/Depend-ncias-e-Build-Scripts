name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'Dependencias e Build Scripts/package-lock.json'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: 'Dependencias e Build Scripts'
        run: npm ci

      - name: Build web app
        working-directory: 'Dependencias e Build Scripts'
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: 'Dependencias e Build Scripts'
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: 'Dependencias e Build Scripts/android'
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: 'Dependencias e Build Scripts/android/app/build/outputs/apk/debug/app-debug.apk'

      - name: Publish APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 'Dependencias e Build Scripts/android/app/build/outputs/apk/debug/app-debug.apk'
          generate_release_notes: true